[project]
name = "oll-project-law-as-code"
version = "0.1.0"
description = "DSPy-based pipeline to transform Swiss legal text (DFTA/AHV) into executable code"
requires-python = ">=3.9"
dependencies = [
    "dspy>=2.6.27",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "lxml>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oll_law_as_code"]
