description: >
  Anteil der elterlichen Mittel, der noch angerechnet wird, wenn der
  teilweise Anrechnungsverzicht greift (Art. 15 Abs. 2 ABG). Der genaue
  Wert wird durch die ABV präzisiert; hier als anpassbarer Parameter
  dargestellt.
