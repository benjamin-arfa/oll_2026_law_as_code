description: >
  Altersgrenze für den Anspruch auf Ausbildungsbeiträge. Nach diesem Alter
  besteht grundsätzlich kein Anspruch mehr — vorbehalten bleiben die
  Ausnahmetatbestände nach Art. 14 Abs. 4 ABG (beruflicher Wiedereinstieg
  nach Familienphase, wichtige Gründe).
