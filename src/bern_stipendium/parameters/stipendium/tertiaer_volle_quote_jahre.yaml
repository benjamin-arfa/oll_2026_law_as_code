description: >
  Anzahl Tertiärjahre, für die das volle Stipendium gewährt wird. Ab dem
  vierten Tertiärjahr werden nur noch zwei Drittel des anerkannten Bedarfs
  als Stipendium gewährt (Art. 10 ABG).
