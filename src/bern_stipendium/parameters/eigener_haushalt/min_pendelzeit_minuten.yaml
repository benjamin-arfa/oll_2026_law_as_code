description: >
  Schwellenwert (Wegzeit zwischen elterlichem Wohnort und Ausbildungsstätte)
  in Minuten, ab dem ein eigener Haushalt als zwingender Grund nach
  Art. 30 Abs. 2 ABV anerkannt wird. Die Verordnung spricht von "mehr als
  eineinhalb Stunden" — der Vergleich in den Formeln erfolgt deshalb
  strikt grösser (`>`), nicht grösser-gleich.
