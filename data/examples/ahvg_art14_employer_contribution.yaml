reasoning: |
  1. Art. 14 para. 1 states the employer owes the same contribution as the employee per Art. 5.
  2. This is a direct cross-reference — the employer contribution equals the employee contribution.
  3. Instead of re-computing the rate × salary, we call person("ahv_employee_contribution", period).
  4. OpenFisca handles the dependency resolution at runtime automatically.
  5. entity = Person, definition_period = MONTH, value_type = float — same as the referenced variable.
