reasoning: |
  1. Art. 41 defines the conditions for tort liability under Swiss law.
  2. The result is a yes/no determination (liable or not) → value_type = bool.
  3. It applies to individual persons → entity = Person.
  4. Liability is assessed per event, approximated yearly → definition_period = YEAR.
  5. Al. 1 requires four conjunctive conditions: unlawful act AND damage AND causation AND fault (intent OR negligence).
  6. Al. 2 provides an alternative ground: intentional harm contrary to morals AND damage AND causation.
  7. The overall result is: liability under al. 1 OR liability under al. 2.
  8. There are no numerical parameters (no rates, thresholds, or amounts) — the parameter YAML contains only a reference entry.
