legal_article_text: |
  Art. 20 — Nullité

  1 Le contrat est nul s'il a pour objet une chose impossible, illicite ou contraire aux mœurs.

  2 Si le contrat n'est vicié que dans certaines de ses clauses, ces clauses sont seules frappées de nullité, à moins qu'il n'y ait lieu d'admettre que le contrat n'aurait pas été conclu sans elles.
article_reference: "OR Art. 20"
openfisca_variable: |
  from openfisca_core.model_api import *
  from openfisca_switzerland.entities import Person


  class or_contract_nullity(Variable):
      value_type = bool
      entity = Person
      definition_period = YEAR
      label = "Contract nullity (Art. 20 CO)"
      default_value = False

      def formula(person, period, parameters):
          has_impossible_object = person("has_impossible_object", period)
          has_illicit_object = person("has_illicit_object", period)
          has_immoral_object = person("has_immoral_object", period)
          has_form_defect = person("has_form_defect", period)
          return has_impossible_object + has_illicit_object + has_immoral_object + has_form_defect > 0
parameter_yaml: |
  description: Contract nullity provision reference (Art. 20 CO) — no numerical parameters
  metadata:
    reference:
      - title: "CO Art. 20 — Nullité"
        href: "https://www.fedlex.admin.ch/eli/cc/27/317_321_377/fr#art_20"
  values:
    1912-01-01:
      value: true
reasoning: |
  1. Art. 20 I CO lists three grounds for contract nullity: impossible object, illicit object/purpose, or contrary to public morals.
  2. The result is a yes/no determination (contract null or not) → value_type = bool.
  3. ANY single ground suffices to render the contract null (disjunctive OR):
     - Impossible object (CO 20 I, 1st hypothesis)
     - Illicit object or purpose (CO 20 I, 2nd hypothesis)
     - Contrary to public morals (CO 20 I, 3rd hypothesis)
     - Form defects (CO 11 ss) are an additional ground
  4. Source: wiki-CO/pretentions/execution.md lines 174-196.
  5. No numerical parameters — the parameter YAML contains only a reference entry.
